<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>게시글 미리보기</title></head><body><p id="previewMessage">게시글 미리보기를 여는 중입니다.</p><script src="blog-data.js?v=20261124-product-url"></script><script>
(function(){
  const local=location.protocol==='file:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if(!local){document.getElementById('previewMessage').textContent='PC에서 사용하는 검토용 미리보기 파일입니다.';return;}
  const posts=window.BLOG_DATA?.posts||[];
  const requested=new URLSearchParams(location.search).get('post');
  const post=requested?posts.find(p=>p.id===requested):(posts.find(p=>p.reviewRequired)||posts[0]);
  if(!post){document.getElementById('previewMessage').textContent='미리 볼 글이 없습니다.';return;}
  location.replace('post.html?post='+encodeURIComponent(post.id)+'&preview=1');
})();
</script></body></html>
