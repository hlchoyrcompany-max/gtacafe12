name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble cafe and blog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/cafe _site/blog
          public_files=(index.html board.html post.html blog-data.js assets css js JL3jZVy984sIQ2127drz)
          for site in cafe blog; do
            for file in "${public_files[@]}"; do
              cp -a "$site/$file" "_site/$site/"
            done
          done
          cp -a "cafe/C8fR2mQ7nL4xT9sV6kDz" _site/cafe/
          # Preserve previously shared root-level article and asset URLs.
          cp -a _site/cafe/. _site/
          for slug in JL3jZVy984sIQ2127drz C8fR2mQ7nL4xT9sV6kDz; do
            sed 's|../C8fR2mQ7nL4xT9sV6kDz/|../cafe/C8fR2mQ7nL4xT9sV6kDz/|g'               "_site/cafe/JL3jZVy984sIQ2127drz/index.html" > "_site/$slug/index.html"
          done
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
